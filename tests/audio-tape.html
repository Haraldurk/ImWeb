<!DOCTYPE html>
<!-- Audio step 1: engine handshake, tape allocation, bulk write, envelope reply.

     Driven by explicit awaits, not requestAnimationFrame — a backgrounded tab
     suspends rAF and would make this pass vacuously (LEARNED 2026-07-12). The
     worklet keeps running either way, which is precisely §8.7's point.

     An AudioContext needs a user gesture, so this page has a button rather than
     running on load. Nothing is audible: process() outputs silence until zones
     arrive in step 2.

     RUN THIS IN A REAL BROWSER. Claude Code's in-app browser pane launches
     Chrome with `--disable-audio`, and with no output device the render thread
     never pulls: AudioContext.state reports 'running', the message port answers
     everything, and process() is simply never called. Every check here except
     the liveness gate is message-only and passes anyway — which is exactly why
     the gate exists and why the rest is skipped when it trips.

     Needs the DEV server, not `vite preview`: this page imports /src/ directly
     and tests/ is not a build input, so it does not exist in dist/. Share the
     owner's :5173 rather than starting a second one — a different port is a
     different origin (LEARNED 2026-07-12).

     Run:  npx vite --port 5173
           open http://localhost:5173/tests/audio-tape.html
-->
<meta charset="utf-8">
<title>Audio tape / protocol test</title>
<body style="background:#111;color:#ddd;font:12px monospace;white-space:pre">
<button id="go" style="font:12px monospace;padding:6px 14px;margin-bottom:10px">Run test (needs a click — AudioContext)</button>
<div id="out"></div>
</body>
<script type="module">
import { AudioEngine } from '/src/audio/AudioEngine.js';

const lines = [];
const el = document.getElementById('out');
const log = (s) => { lines.push(s); el.textContent = lines.join('\n'); };
let failures = 0;
const check = (label, cond, detail = '') => {
  if (cond) log(`  ok   ${label}`);
  else { log(`  FAIL ${label}${detail ? ` — ${detail}` : ''}`); failures++; }
};
const near = (a, b, eps = 1e-4) => Math.abs(a - b) <= eps;

document.getElementById('go').onclick = async (e) => {
  e.target.disabled = true;
  lines.length = 0;

  const eng = new AudioEngine();
  eng.onRefuse = (code, msg) => log(`  !! refuse ${code}: ${msg}`);
  eng.onProcessorError = (e) => log(
    `  !! PROCESSOR DIED: ${e.message || e.type} — process() will never run again`);

  log('handshake');
  await eng.start();
  check('engine answered /engine/hello', eng.sampleRate > 0,
    'a hang here is the handshake, not the DSP');
  check('sample rate is plausible', eng.sampleRate >= 8000 && eng.sampleRate <= 192000,
    String(eng.sampleRate));
  log(`       sampleRate=${eng.sampleRate} maxTape=${eng.maxTapeSeconds}s`);

  // EVERY check below except this one is message-only: the port answers whether
  // or not the audio thread is running, so a suspended AudioContext passes them
  // all. `/tape/env/dirty` is emitted only from process(), which makes it the
  // one honest liveness proof — without it this whole page can be green while
  // the engine is frozen.
  log('\nthe audio thread is actually running');
  check('AudioContext is running, not suspended', eng.ctx.state === 'running',
    `state=${eng.ctx.state} — a suspended context makes every check below vacuous`);

  log('\ntape allocation and bulk write');
  const SECONDS = 2;
  // WAIT for the audio thread rather than assuming it. The output device can
  // take a second or more to start on first use, and every check that depends
  // on process() having run will fail misleadingly until it does — which is
  // what made this page intermittent before the wait was a precondition.
  const beat = new Promise((r) => {
    const prev = eng.onDirty;
    eng.onDirty = (a, b) => { eng.onDirty = prev; r([a, b]); };
    setTimeout(() => r(null), 5000);
  });
  eng.allocTape(SECONDS);
  const live = !!(await beat);
  check('process() ran and flushed a dirty region', live,
    'no /tape/env/dirty in 5s — the audio callback never fired');
  const n = Math.floor(eng.sampleRate * SECONDS);

  // A known shape: silence, then a full-scale ramp over the middle quarter, so
  // the envelope has an unmistakable signature at a known column range. A flat
  // fixture would hide a column-arithmetic bug (LEARNED 2026-07-30).
  const from = Math.floor(n * 0.25), len = Math.floor(n * 0.25);
  const buf = new Float32Array(len);
  for (let i = 0; i < len; i++) buf[i] = (i / (len - 1)) * 2 - 1;   // -1 → +1
  eng.write(from, 1, buf);

  log('\nenvelope request/reply');
  const COLS = 64;
  const env = await eng.requestEnvelope(0, n, COLS);
  check('reply arrived', !!env);
  check('reply echoes the column count', env.columns === COLS, String(env.columns));
  check('reply carries min/max pairs', env.data.length === COLS * 2, String(env.data.length));
  check('reqId is echoed', env.reqId > 0);

  // Columns 0-15 and 32-63 are untouched tape; 16-31 hold the ramp.
  const col = (c) => [env.data[c * 2], env.data[c * 2 + 1]];
  const [q0lo, q0hi] = col(4);
  const [q1lo, q1hi] = col(24);
  const [q3lo, q3hi] = col(48);
  check('silence before the ramp reads as zero', near(q0lo, 0) && near(q0hi, 0),
    `[${q0lo}, ${q0hi}]`);
  check('silence after the ramp reads as zero', near(q3lo, 0) && near(q3hi, 0),
    `[${q3lo}, ${q3hi}]`);
  check('the ramp column is non-trivial', q1hi > q1lo, `[${q1lo}, ${q1hi}]`);
  check('the ramp spans roughly full scale',
    col(16)[0] < -0.9 && col(31)[1] > 0.9,
    `first=${col(16)} last=${col(31)}`);
  check('min never exceeds max in any column',
    Array.from({ length: COLS }, (_, c) => col(c)).every(([lo, hi]) => lo <= hi));

  log('\nzoom asks rather than resamples (§6 item 6)');
  const zoom = await eng.requestEnvelope(from, from + len, COLS);
  check('zoomed span is echoed back', zoom.start === from && zoom.end === from + len,
    `${zoom.start}..${zoom.end}`);
  const zLo = zoom.data[0], zHi = zoom.data[COLS * 2 - 1];
  check('zoomed view resolves the ramp ends', zLo < -0.9 && zHi > 0.9,
    `${zLo} .. ${zHi}`);

  log('\ncoalescing: one outstanding request per view');
  const a = eng.requestEnvelope(0, n, 32);
  const b = eng.requestEnvelope(0, n, 48);
  const c = eng.requestEnvelope(0, n, COLS);
  const [ra, rb, rc] = await Promise.all([a, b, c]);
  check('first request completes', !!ra && ra.columns === 32);
  check('superseded request resolves null, not rejected', rb === null,
    'being overtaken during a drag is normal, not an error');
  check('newest request completes', !!rc && rc.columns === COLS);

  log('\nrefusals');
  let refused = null;
  eng.onRefuse = (code, msg) => { refused = [code, msg]; };
  eng.write(n - 4, 1, new Float32Array(1024));           // past the end
  await new Promise((r) => setTimeout(r, 120));
  check('an out-of-range write is refused, not silently clamped', !!refused,
    refused ? `${refused[0]}: ${refused[1]}` : 'no /engine/refuse arrived');

  log('\nprotocol enforcement on the client side');
  let threw = false;
  try { eng.allocTape('sixty'); } catch { threw = true; }
  check('encode() refuses a non-OSC argument before it reaches the port', threw,
    'rule 1 must bite where the developer meets it');

  // ── step 2: partitions and zones ────────────────────────────────────────
  log('\npartitions (§4.3)');
  refused = null;
  eng.onRefuse = (code, msg) => { refused = [code, msg]; };

  // Partition 0 holds the ramp; partition 1 is empty space after it.
  eng.partBounds(0, from, len);
  eng.partBounds(1, from + len, Math.floor(n * 0.2));
  await new Promise((r) => setTimeout(r, 80));
  check('valid partition bounds are accepted', refused === null,
    refused ? `${refused[0]}: ${refused[1]}` : '');

  refused = null;
  eng.partBounds(0, 0, n * 4);                       // past the end of the tape
  await new Promise((r) => setTimeout(r, 80));
  check('out-of-tape partition bounds are refused', !!refused,
    refused ? `${refused[0]}: ${refused[1]}` : 'no refusal');

  log('\nplayback zone reads its region (§4.4)');
  eng.zonePart('play', 0, 0);
  eng.zoneRegion('play', 0, 0, len);
  eng.playRate(0, 1);
  eng.outGain(1);
  eng.zoneOn('play', 0);
  await new Promise((r) => setTimeout(r, 250));

  refused = null;
  eng.partBounds(0, from, len);                      // slot 0 now has a live zone
  await new Promise((r) => setTimeout(r, 80));
  check('relayout is refused while a zone on that slot runs', !!refused,
    refused ? `${refused[0]}: ${refused[1]}` : '§4.3 says layout is a setup act');
  check('the refusal is LAYOUT_LOCKED, not a generic error',
    refused && refused[0] === 4, refused ? String(refused[0]) : '');

  log('\nsigned rate: the same zone runs backwards');
  eng.playRate(0, -1);
  await new Promise((r) => setTimeout(r, 150));
  check('a negative rate is accepted', true, 'audible check is the point of headphones');
  eng.zoneOff('play', 0);
  await new Promise((r) => setTimeout(r, 150));

  refused = null;
  eng.partBounds(0, from, len);
  await new Promise((r) => setTimeout(r, 120));
  check('relayout succeeds once the zone has faded out', refused === null,
    refused ? `${refused[0]}: ${refused[1]}` : '');

  log('\nrecording zone writes the tape');
  if (!live) {
    log('  SKIP — the audio thread never started; these would fail misleadingly');
    document.title = `${failures} FAIL`;
    return;
  }
  // Record silence from an unconnected input into partition 1, over material we
  // first dirty with a DC offset, so "the recorder ran" is distinguishable from
  // "nothing happened" — a silent-into-silent test would pass while dead.
  const p1from = from + len, p1len = Math.floor(n * 0.2);
  const dc = new Float32Array(p1len).fill(0.5);
  eng.write(p1from, 1, dc);
  await new Promise((r) => setTimeout(r, 80));
  const before = await eng.requestEnvelope(p1from, p1from + p1len, 8, 'p1');
  check('partition 1 holds the DC offset before recording',
    before.data[1] > 0.4, String(before.data[1]));

  // Feed the engine's INPUT a real signal. An unconnected worklet input is an
  // empty array rather than silence, so recording "silence" would have passed
  // with a dead recorder — the bipolar sine is what makes the check bite. The
  // oscillator reaches the worklet input only, never the destination, so this
  // does not put a tone through the monitors.
  const osc = eng.ctx.createOscillator();
  osc.frequency.value = 220;
  osc.connect(eng.node);
  osc.start();

  eng.zonePart('rec', 0, 1);
  eng.zoneRegion('rec', 0, 0, p1len);
  eng.zoneOn('rec', 0);
  await new Promise((r) => setTimeout(r, 300));
  eng.zoneOff('rec', 0);
  osc.stop();
  osc.disconnect();
  await new Promise((r) => setTimeout(r, 100));

  const after = await eng.requestEnvelope(p1from, p1from + p1len, 8, 'p1');
  const [aLo, aHi] = [after.data[0], after.data[1]];
  // The region held a constant +0.5, so min === max === 0.5. Any negative
  // minimum proves the recorder overwrote it; the peak is full-scale because
  // the oscillator is, which is why the check is on the minimum, not the peak.
  check('recording replaced the DC offset with the captured signal',
    aLo < -0.1 && aLo !== aHi, `[${aLo}, ${aHi}] — DC was [0.5, 0.5]`);
  check('the captured signal is bipolar, i.e. actually the oscillator',
    aLo < 0 && aHi > 0, `[${aLo}, ${aHi}]`);
  check('recording stayed inside its partition',
    Math.abs(after.data[15]) <= 0.5 + 1e-6,
    'a zone writing past its bounds is the failure that ruins a set');

  log('\nbounds: a zone cannot write outside its partition');
  const ramp0 = await eng.requestEnvelope(from, from + len, 8, 'p0');
  check('the ramp in partition 0 survived the recording',
    ramp0.data[0] < -0.5 && ramp0.data[15] > 0.5,
    `${ramp0.data[0]} .. ${ramp0.data[15]}`);

  log('\noutput bus (§4.11)');
  check('there is no client method to disable the limiter',
    typeof eng.bypassLimiter !== 'function' && typeof eng.limiterOff !== 'function');
  let limThrew = false;
  try { eng.outLimit(false, 0.1); } catch { limThrew = true; }
  check('the limiter refuses a boolean where a threshold belongs', limThrew,
    'a T/F here would be a bypass in disguise');

  await eng.close();
  log(failures ? `\n${failures} FAILURE(S)` : '\nAll audio checks passed (steps 1 and 2).');
  document.title = failures ? `${failures} FAIL` : 'PASS';
};
</script>
