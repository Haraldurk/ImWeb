<!DOCTYPE html>
<!-- Phase 26 acceptance test — Rutt-Etra Scan Processor.

     Drives RuttEtra.tick() DIRECTLY rather than through the app, so it does not
     depend on requestAnimationFrame. That matters: a backgrounded tab suspends
     rAF entirely (document.hidden => 0 fps), which is what invalidated the first
     attempt to check this feature through the running app — and what invalidated
     an earlier SlitScan commit before it (Blueprint 5c).

     What is under test, in order of how badly it would hurt to get wrong:

       1. BEAM WIDTH IS A LIVE CONTROL. THREE.LineBasicMaterial.linewidth is
          capped at 1 by ANGLE and every major browser, so the obvious
          implementation ships a knob that silently does nothing. The ribbon
          expansion must make lit-pixel count rise with rutt.thickness.
       2. DEFLECTION IS REAL. Z gain must change the picture, otherwise the
          vertex-stage texture fetch is silently returning zero — the failure
          mode that would leave a flat lattice looking like a plausible raster.
       3. PERSISTENCE PING-PONGS. With the source gone black, decay 0 must go
          dark and decay high must retain. This is what proves the two render
          targets are actually swapping rather than one being read and written.
       4. The gate short-circuits when inactive, and a line-count change
          rebuilds without tearing.

     Run:  npx vite --port 5199
           open http://localhost:5199/tests/rutt-etra.html
-->
<meta charset="utf-8">
<title>Rutt-Etra test</title>
<body style="background:#111;color:#ddd;font:12px monospace;white-space:pre"></body>
<script type="module">
import * as THREE from 'three';
import { RuttEtra } from '/src/inputs/RuttEtra.js';

const out = [];
const log = (s) => { out.push(s); document.body.textContent = out.join('\n'); };
let fails = 0;
const check = (label, cond, detail = '') => {
  log(`${cond ? '  ok  ' : '  FAIL'} ${label}${detail ? `  — ${detail}` : ''}`);
  if (!cond) fails++;
};

const W = 192, H = 128;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(W, H);

// ── Parameter stub ───────────────────────────────────────────────────────────
const vals = {
  'rutt.active': 1, 'rutt.source': 0, 'rutt.lines': 60, 'rutt.zgain': 0.8,
  'rutt.zcurve': 1, 'rutt.zpivot': 0,
  'rutt.thickness': 1.5, 'rutt.angle': 0, 'rutt.elev': 35, 'rutt.dist': 3.2,
  'rutt.decay': 0, 'rutt.bleed': 0,
  'rutt.hue': 0, 'rutt.sat': 0, 'rutt.colorAmt': 0,
  'rutt.rise': 0, 'rutt.fall': 0, 'rutt.drawMode': 0, 'rutt.pointSize': 3,
  'rutt.moveX': 0, 'rutt.moveY': 0, 'rutt.moveZ': 0,
};
const ps = { get: (id) => (id in vals ? { value: vals[id] } : undefined) };

/** A source render target: horizontal luminance ramp, dark left, bright right. */
function rampRT(scale = 1) {
  const rt = new THREE.WebGLRenderTarget(W, H, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: false,
  });
  const mat = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: scale } },
    vertexShader: `varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `varying vec2 vUv; uniform float uScale;
      void main() { gl_FragColor = vec4(vec3(vUv.x * uScale), 1.0); }`,
  });
  const scene = new THREE.Scene();
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  renderer.setRenderTarget(rt);
  renderer.render(scene, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
  renderer.setRenderTarget(null);
  return rt;
}

// .texture, not the render target: tick() takes a Texture, because main.js
// hands it the result of _resolveLayerTex(), which is already unwrapped.
const bright = rampRT(1).texture;
const black  = rampRT(0).texture;

/** A source with genuine CHROMA — red on the left, blue on the right — so that
 *  "carries the source's colour" can be told apart from "applies a tint". */
function chromaRT() {
  const rt = new THREE.WebGLRenderTarget(W, H, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: false,
  });
  const mat = new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `varying vec2 vUv;
      void main() { gl_FragColor = vec4(1.0 - vUv.x, 0.35, vUv.x, 1.0); }`,
  });
  const scene = new THREE.Scene();
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  renderer.setRenderTarget(rt);
  renderer.render(scene, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
  renderer.setRenderTarget(null);
  return rt.texture;
}
const chroma = chromaRT();

const re = new RuttEtra(renderer, W, H);
const buf = new Uint8Array(W * H * 4);

/** Read the CURRENT front buffer and summarise it. */
function stats() {
  renderer.readRenderTargetPixels(re._cur, 0, 0, W, H, buf);
  let lit = 0, sum = 0, max = 0, ySum = 0, xSum = 0, minY = 1e9, maxY = -1e9;
  let sR = 0, sG = 0, sB = 0, sChroma = 0;
  for (let i = 0; i < buf.length; i += 4) {
    const v = buf[i], g = buf[i + 1], b = buf[i + 2];
    sum += v; sR += v; sG += g; sB += b;
    // PER-PIXEL colour spread. Channel MEANS are blind to a symmetric source:
    // red-left/blue-right averages to mean R == mean B, so a grey render and a
    // fully chromatic one score identically — this check passed for the wrong
    // reason until it was measured per pixel.
    sChroma += Math.abs(v - g) + Math.abs(g - b) + Math.abs(v - b);
    if (v > max) max = v;
    if (v > 8) {
      const px = (i / 4) | 0;
      const y = Math.floor(px / W);
      lit++; ySum += y; xSum += px % W;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  // Vertical centroid and extent. A DEPTH change is a SHAPE change, and lit-area
  // is nearly blind to it — reshaping the relief moves the mass up or down the
  // screen while lighting a similar number of pixels. Measuring where the mass
  // sits catches what counting it cannot.
  const n = W * H;
  return { lit, mean: sum / n, max,
           cy: lit ? ySum / lit : 0, cx: lit ? xSum / lit : 0,
           spanY: lit ? maxY - minY : 0,
           r: sR / n, g: sG / n, b: sB / n, chroma: sChroma / n };
}

/** Fresh ping-pong state, so one test cannot inherit another's phosphor. */
function reset() {
  vals['rutt.decay'] = 0;
  re.tick(ps, 0.016, black);
  re.tick(ps, 0.016, black);
}

// ── 1. It draws ──────────────────────────────────────────────────────────────
log('\nrenders at all');
reset();
re.tick(ps, 0.016, bright);
const base = stats();
check('a bright source lights pixels', base.lit > 200, `lit=${base.lit} max=${base.max}`);
check('a black source lights nothing', (reset(), stats()).lit === 0);

// ── 2. Beam width is a live control, not `linewidth` ─────────────────────────
log('\nbeam width (the knob most likely to be dead)');
// Measured at a SPARSE line count on purpose. At 60 lines the lattice already
// fills the frame, so widening the beam overlaps its neighbours and lit area
// saturates (7964 -> 9244 across a 6x width change) — which would let a
// dead-knob implementation slip through a loose threshold. At 8 lines the
// beams are disjoint and the relationship is the real one: linear in width.
const beam = (th) => {
  vals['rutt.lines'] = 8; vals['rutt.thickness'] = th;
  reset(); re.tick(ps, 0.016, bright); return stats().lit;
};
const b1 = beam(1), b2 = beam(2), b4 = beam(4);
check('lit area is LINEAR in rutt.thickness (so it is not `linewidth`)',
  Math.abs(b2 / b1 - 2) < 0.15 && Math.abs(b4 / b1 - 4) < 0.35,
  `1px=${b1} 2px=${b2} (${(b2 / b1).toFixed(2)}x) 4px=${b4} (${(b4 / b1).toFixed(2)}x)`);
vals['rutt.lines'] = 60; vals['rutt.thickness'] = 1.5;

// ── 3. Deflection is real ────────────────────────────────────────────────────
log('\ndeflection');
reset(); vals['rutt.zgain'] = 0; re.tick(ps, 0.016, bright);
const flat = stats();
reset(); vals['rutt.zgain'] = 1.8; re.tick(ps, 0.016, bright);
const deep = stats();
check('z gain changes the picture', Math.abs(deep.lit - flat.lit) > 50,
  `flat=${flat.lit} deep=${deep.lit}`);
// A signed gain must not merely mirror the magnitude — it displaces the other
// way, so under a tilted camera the projected extent genuinely differs.
reset(); vals['rutt.zgain'] = -1.8; re.tick(ps, 0.016, bright);
const inv = stats();
check('negative z gain renders (relief inverts, still lit)', inv.lit > 200,
  `lit=${inv.lit}`);
vals['rutt.zgain'] = 0.8;

// ── 3b. Depth transfer function ──────────────────────────────────────────────
log('\nz curve and pivot');
const shot = (o) => { Object.assign(vals, o); reset(); re.tick(ps, 0.016, bright); return stats(); };

// Gamma > 1 darkens the midtones, so a ramp's relief gets SHALLOWER.
//
// Asserted on the CENTROID, not the extent: a full-range ramp has pow(0,g)=0
// and pow(1,g)=1, so gamma cannot move the endpoints and the bounding span is
// invariant by construction — that version of this check passed 107 vs 107 on
// working code. The mass between the endpoints is the only thing gamma touches,
// and it must move in the same direction reducing displacement does (which the
// pivot case below independently pins down).
const c1 = shot({ 'rutt.zgain': 1.2, 'rutt.zcurve': 1, 'rutt.zpivot': 0 });
const c3 = shot({ 'rutt.zcurve': 3 });
check('z curve flattens the relief as gamma rises', c3.cy > c1.cy + 2,
  `centroid curve1=${c1.cy.toFixed(1)} curve3=${c3.cy.toFixed(1)}`);

// Pivot subtracts a constant before scaling, so the whole sheet translates in
// depth — the vertical CENTROID must move while the extent survives.
const p0 = shot({ 'rutt.zcurve': 1, 'rutt.zpivot': 0 });
const p6 = shot({ 'rutt.zpivot': 0.6 });
check('z pivot translates the relief in depth', Math.abs(p6.cy - p0.cy) > 3,
  `centroid pivot0=${p0.cy.toFixed(1)} pivot0.6=${p6.cy.toFixed(1)}`);

// The structural assertion: both act through Z ONLY. At zero gain the geometry
// collapses to the flat sheet, so neither knob may alter a single pixel — which
// is what proves they are not quietly dimming the beam along with the depth.
const flat0 = shot({ 'rutt.zgain': 0, 'rutt.zcurve': 1,   'rutt.zpivot': 0   });
const flatC = shot({ 'rutt.zgain': 0, 'rutt.zcurve': 3.5, 'rutt.zpivot': 0.8 });
check('at zero gain, curve and pivot change NOTHING (they touch geometry only)',
  flat0.lit === flatC.lit && Math.abs(flat0.mean - flatC.mean) < 0.001,
  `lit ${flat0.lit} vs ${flatC.lit}, mean ${flat0.mean.toFixed(3)} vs ${flatC.mean.toFixed(3)}`);

// And curve 1.0 must be the exact identity, so pre-existing patches are safe.
const idA = shot({ 'rutt.zgain': 1.2, 'rutt.zcurve': 1, 'rutt.zpivot': 0 });
const idB = shot({ 'rutt.zcurve': 1.0 });
check('curve 1.0 is a bit-exact identity', idA.lit === idB.lit && idA.mean === idB.mean,
  `${idA.lit}/${idA.mean.toFixed(4)} vs ${idB.lit}/${idB.mean.toFixed(4)}`);
Object.assign(vals, { 'rutt.zgain': 0.8, 'rutt.zcurve': 1, 'rutt.zpivot': 0 });

// ── 3c. Colour ───────────────────────────────────────────────────────────────
log('\ncolour');
const shotC = (o, tex) => { Object.assign(vals, o); reset(); re.tick(ps, 0.016, tex); return stats(); };
const MONO = { 'rutt.hue': 0, 'rutt.sat': 0, 'rutt.colorAmt': 0 };

// Structural: at Src Color 0 a chroma source must come out perfectly grey. This
// is what proves the source's hue reaches the picture ONLY through that control.
const grey = shotC({ ...MONO }, chroma);
check('src color 0 renders a chroma source as pure grey', grey.chroma < 0.5,
  `per-pixel chroma=${grey.chroma.toFixed(2)}`);

const full = shotC({ ...MONO, 'rutt.colorAmt': 1 }, chroma);
check('src color 1 carries the source chroma through', full.chroma > 20,
  `per-pixel chroma ${grey.chroma.toFixed(2)} -> ${full.chroma.toFixed(2)}`);

// Tint on a GREY source, so any chroma in the output can only have come from it.
const tinted = shotC({ 'rutt.hue': 0, 'rutt.sat': 1, 'rutt.colorAmt': 0 }, bright);
check('tint colours a monochrome source', tinted.r > tinted.g * 1.5 && tinted.r > tinted.b * 1.5,
  `rgb ${tinted.r.toFixed(2)}/${tinted.g.toFixed(2)}/${tinted.b.toFixed(2)}`);

const tinted2 = shotC({ 'rutt.hue': 220, 'rutt.sat': 1, 'rutt.colorAmt': 0 }, bright);
check('tint hue is honoured (220 gives blue, not red)', tinted2.b > tinted2.r * 1.5,
  `rgb ${tinted2.r.toFixed(2)}/${tinted2.g.toFixed(2)}/${tinted2.b.toFixed(2)}`);

// Tint is a lerp from WHITE, so hue is inert at saturation 0 — and the default
// is therefore the original monochrome no matter where hue sits.
const h0 = shotC({ 'rutt.hue': 0,   'rutt.sat': 0, 'rutt.colorAmt': 0 }, bright);
const h9 = shotC({ 'rutt.hue': 290, 'rutt.sat': 0, 'rutt.colorAmt': 0 }, bright);
check('hue is inert at zero saturation (the default is exactly monochrome)',
  h0.r === h9.r && h0.g === h9.g && h0.b === h9.b && Math.abs(h0.r - h0.b) < 0.01,
  `hue0 ${h0.r.toFixed(3)}/${h0.b.toFixed(3)} vs hue290 ${h9.r.toFixed(3)}/${h9.b.toFixed(3)}`);
Object.assign(vals, MONO);

// ── 3d. Asymmetric temporal slew ─────────────────────────────────────────────
log('\ntemporal slew');
const SLEW_OFF = { 'rutt.rise': 0, 'rutt.fall': 0 };

// Baseline: with slew off the picture must be untouched. This is the bypass
// under test as much as the maths — routing through the 512² history at
// coefficient 1 would resample the source and quietly soften every patch.
Object.assign(vals, SLEW_OFF); reset();
re.tick(ps, 0.016, bright);
const noSlew = stats();

// Rise: from black, a step to bright must NOT arrive in one frame, and must
// climb monotonically toward the level it reaches with no slew at all.
Object.assign(vals, { 'rutt.rise': 0.5, 'rutt.fall': 0 });
reset(); Object.assign(vals, { 'rutt.rise': 0.5, 'rutt.fall': 0 });
re.tick(ps, 0.016, black);                     // prime the history at black
const climb = [];
for (let i = 0; i < 6; i++) { re.tick(ps, 0.016, bright); climb.push(stats().mean); }
check('rise does not arrive in one frame', climb[0] < noSlew.mean * 0.5,
  `first=${climb[0].toFixed(1)} instant=${noSlew.mean.toFixed(1)}`);
check('rise climbs monotonically', climb.every((v, i) => i === 0 || v > climb[i - 1]),
  climb.map(v => v.toFixed(1)).join(' -> '));

// Fall, and the ASYMMETRY: identical settling from the same lit state, one with
// a fast fall and one with a slow one, must diverge — that is the whole feature.
const settle = (fallT) => {
  Object.assign(vals, { 'rutt.rise': 0, 'rutt.fall': fallT }); reset();
  Object.assign(vals, { 'rutt.rise': 0, 'rutt.fall': fallT });
  re.tick(ps, 0.016, bright);                  // history primed bright
  for (let i = 0; i < 8; i++) re.tick(ps, 0.016, black);
  return stats().mean;
};
const fastFall = settle(0.05), slowFall = settle(1.5);
check('fall time is asymmetric and slow fall retains more', slowFall > fastFall * 3,
  `fast=${fastFall.toFixed(1)} slow=${slowFall.toFixed(1)}`);

// FRAME-RATE INDEPENDENCE — the reason these are seconds and not frames.
// Each step multiplies the remaining distance by exp(-dt/tau), so n steps land
// on exp(-n·dt/tau) however n and dt were divided. Same elapsed time, different
// step counts, same answer.
const elapse = (dt, n) => {
  Object.assign(vals, { 'rutt.rise': 0.4, 'rutt.fall': 0 }); reset();
  Object.assign(vals, { 'rutt.rise': 0.4, 'rutt.fall': 0 });
  re.tick(ps, 0.016, black);
  for (let i = 0; i < n; i++) re.tick(ps, dt, bright);
  return stats().mean;
};
const at60 = elapse(1 / 60, 24), at30 = elapse(1 / 30, 12);   // 0.4 s either way
check('same elapsed time gives the same result at 30 and 60 fps',
  Math.abs(at60 - at30) < Math.max(at60, at30) * 0.05,
  `60fps=${at60.toFixed(2)} 30fps=${at30.toFixed(2)}`);

// It must ARRIVE, not stall short. An exponential approach takes ever smaller
// steps and the history is half float, so without the guaranteed-progress step
// this froze at 98.51 against 100.91 — and stayed there, bit for bit, from frame
// 300 to frame 2000. Checked at two horizons precisely because a stall looks
// exactly like convergence if you only sample it once.
Object.assign(vals, { 'rutt.rise': 1.2, 'rutt.fall': 0 }); reset();
Object.assign(vals, { 'rutt.rise': 1.2, 'rutt.fall': 0 });
re.tick(ps, 0.016, black);
for (let i = 0; i < 300; i++) re.tick(ps, 0.016, bright);
const at300 = stats().mean;
for (let i = 0; i < 300; i++) re.tick(ps, 0.016, bright);
const at600 = stats().mean;
check('a long slew arrives at the un-slewed level (no quantisation stall)',
  Math.abs(at600 - noSlew.mean) < noSlew.mean * 0.005,
  `at600=${at600.toFixed(2)} target=${noSlew.mean.toFixed(2)}`);
check('and it was still moving at frame 300, not frozen early',
  at600 >= at300, `at300=${at300.toFixed(2)} at600=${at600.toFixed(2)}`);

Object.assign(vals, SLEW_OFF); reset();
re.tick(ps, 0.016, bright);
const backOff = stats();
check('slew off is a true bypass — identical to never having been enabled',
  backOff.lit === noSlew.lit && backOff.mean === noSlew.mean,
  `${backOff.lit}/${backOff.mean.toFixed(4)} vs ${noSlew.lit}/${noSlew.mean.toFixed(4)}`);

// ── 3e. Draw mode ────────────────────────────────────────────────────────────
log('\ndraw mode');
const draw = (m, extra = {}) => {
  Object.assign(vals, { 'rutt.drawMode': m, 'rutt.lines': 40, ...extra });
  reset(); re.tick(ps, 0.016, bright); return stats();
};
const asLines = draw(0), asPoints = draw(1), asBoth = draw(2);
check('points mode renders', asPoints.lit > 200, `lit=${asPoints.lit}`);
check('both draws at least as much as either alone',
  asBoth.lit >= Math.max(asLines.lit, asPoints.lit) - 2,
  `lines=${asLines.lit} points=${asPoints.lit} both=${asBoth.lit}`);

// Sparser than lines — but compared at MATCHED width, which is the only version
// of this claim that means anything. Dot defaults to 3px against Beam's 1.5, so
// comparing the two defaults says something about the defaults, not about the
// primitives: a continuous ribbon covers more than a discrete dot lattice.
const evenLines  = draw(0, { 'rutt.thickness': 3 });
const evenPoints = draw(1, { 'rutt.pointSize': 3 });
check('at matched width, points are sparser than continuous lines',
  evenPoints.lit < evenLines.lit,
  `lines@3px=${evenLines.lit} points@3px=${evenPoints.lit}`);

// Dot sizes the points. gl_PointSize is capped at 1 on some drivers, which
// would leave this control dead in Points mode while Beam still worked in Lines
// — a platform failure worth catching here rather than in a performance.
const dotThin = draw(1, { 'rutt.pointSize': 1 });
const dotFat  = draw(1, { 'rutt.pointSize': 6 });
check('dot size scales the points (gl_PointSize is not capped at 1)',
  dotFat.lit > dotThin.lit * 2,
  `1px=${dotThin.lit} 6px=${dotFat.lit} (${(dotFat.lit / dotThin.lit).toFixed(2)}x)`);

// The two widths are INDEPENDENT, which is the whole reason Dot is its own
// control: Both mode wants a thin ribbon under fat dots. Each must move only
// its own primitive.
const beamOnPoints = draw(1, { 'rutt.pointSize': 3, 'rutt.thickness': 8 });
const beamOnPoints2 = draw(1, { 'rutt.pointSize': 3, 'rutt.thickness': 1 });
check('beam does not affect points', beamOnPoints.lit === beamOnPoints2.lit,
  `beam8=${beamOnPoints.lit} beam1=${beamOnPoints2.lit}`);

const dotOnLines = draw(0, { 'rutt.thickness': 2, 'rutt.pointSize': 1 });
const dotOnLines2 = draw(0, { 'rutt.thickness': 2, 'rutt.pointSize': 14 });
check('dot size does not affect lines', dotOnLines.lit === dotOnLines2.lit,
  `dot1=${dotOnLines.lit} dot14=${dotOnLines2.lit}`);

Object.assign(vals, { 'rutt.drawMode': 0, 'rutt.lines': 60,
                      'rutt.thickness': 1.5, 'rutt.pointSize': 3 });

// ── 4. Camera orbit ──────────────────────────────────────────────────────────
log('\ncamera');
reset(); vals['rutt.angle'] = 0;  re.tick(ps, 0.016, bright);
const front = stats();
reset(); vals['rutt.angle'] = 65; re.tick(ps, 0.016, bright);
const orbit = stats();
check('orbit changes the projection', Math.abs(orbit.lit - front.lit) > 50,
  `0deg=${front.lit} 65deg=${orbit.lit}`);
vals['rutt.angle'] = 0;

// The Euler rig must reproduce the spherical positions the old lookAt code
// wrote by hand — checked against the formula at a spread of angles rather than
// trusting the algebra, INCLUDING the poles the old rig could not express.
const D = Math.PI / 180;
let rigErr = 0, worst = '';
for (const [az, el] of [[0, 0], [0, 35], [65, 35], [180, -40], [270, 12],
                        [0, 90], [0, -90], [45, 140], [300, -175]]) {
  Object.assign(vals, { 'rutt.angle': az, 'rutt.elev': el, 'rutt.dist': 3.2 });
  reset(); re.tick(ps, 0.016, bright);
  const p = re._camera.position;
  const want = [3.2 * Math.cos(el * D) * Math.sin(az * D),
                3.2 * Math.sin(el * D),
                3.2 * Math.cos(el * D) * Math.cos(az * D)];
  const e = Math.max(Math.abs(p.x - want[0]), Math.abs(p.y - want[1]), Math.abs(p.z - want[2]));
  if (e > rigErr) { rigErr = e; worst = `${az}/${el}`; }
}
check('camera position matches the spherical formula at every angle',
  rigErr < 1e-5, `worst error ${rigErr.toExponential(1)} at az/el ${worst}`);

// Past the pole the lattice must still render — this is the range that simply
// did not exist while lookAt owned the orientation.
Object.assign(vals, { 'rutt.angle': 0, 'rutt.elev': 90 });
reset(); re.tick(ps, 0.016, bright);
const atPole = stats();
check('renders AT the pole (elev 90, where lookAt was undefined)',
  atPole.lit > 0 && Number.isFinite(re._camera.position.y),
  `lit=${atPole.lit} camY=${re._camera.position.y.toFixed(3)}`);

Object.assign(vals, { 'rutt.angle': 0, 'rutt.elev': 140 });
reset(); re.tick(ps, 0.016, bright);
check('renders past the pole (elev 140)', stats().lit > 0);
Object.assign(vals, { 'rutt.angle': 0, 'rutt.elev': 35, 'rutt.dist': 3.2 });

// ── 4b. Move ─────────────────────────────────────────────────────────────────
log('\nmove');
const moved = (o) => { Object.assign(vals, { 'rutt.moveX': 0, 'rutt.moveY': 0,
  'rutt.moveZ': 0, ...o }); reset(); re.tick(ps, 0.016, bright); return stats(); };
const home = moved({});
const mx = moved({ 'rutt.moveX': 0.7 });
const my = moved({ 'rutt.moveY': 0.7 });
const zNear = moved({ 'rutt.moveZ': 0.9 });
const zFar  = moved({ 'rutt.moveZ': -0.9 });
check('move x shifts the lattice horizontally', Math.abs(mx.cx - home.cx) > 5,
  `cx ${home.cx.toFixed(1)} -> ${mx.cx.toFixed(1)}`);
check('move y shifts it vertically', Math.abs(my.cy - home.cy) > 5,
  `cy ${home.cy.toFixed(1)} -> ${my.cy.toFixed(1)}`);

// A pan preserves apparent size; a DEPTH move does not. Asserted as monotonic
// in z and in both directions, which is the signature a translation across the
// view plane cannot fake.
//
// Not asserted on the centroid holding still, which was the first attempt and
// failed on correct code: the lattice is not centred in frame, so scaling it
// about the projection centre moves the centroid too. Nor on vertical extent —
// a big z move pushes the picture far enough up the frame to clip, so the
// bounding box shrinks in BOTH directions and hides the sign.
check('move z is a depth move — apparent size is monotonic in z',
  zNear.lit > home.lit && home.lit > zFar.lit,
  `near=${zNear.lit} home=${home.lit} far=${zFar.lit}`);
check('move x and y preserve apparent size (they pan, not dolly)',
  Math.abs(mx.spanY - home.spanY) <= 3 && Math.abs(my.spanY - home.spanY) <= 3,
  `spanY home=${home.spanY} x=${mx.spanY} y=${my.spanY}`);
check('move defaults are a true identity', home.lit === front.lit,
  `${home.lit} vs ${front.lit}`);
moved({});

// ── 5. Persistence ping-pongs ────────────────────────────────────────────────
log('\nphosphor persistence');
reset();
vals['rutt.decay'] = 0;
re.tick(ps, 0.016, bright);
re.tick(ps, 0.016, black);          // signal gone
check('decay 0 goes dark immediately', stats().lit === 0, `lit=${stats().lit}`);

reset();
vals['rutt.decay'] = 0.9;
re.tick(ps, 0.016, bright);
const litFrame = stats().lit;
re.tick(ps, 0.016, black);
const trail1 = stats();
re.tick(ps, 0.016, black);
const trail2 = stats();
check('decay 0.9 retains a trail after the signal stops', trail1.lit > 100,
  `lit=${litFrame} -> trail=${trail1.lit}`);
check('the trail fades rather than holding', trail2.mean < trail1.mean,
  `mean ${trail1.mean.toFixed(2)} -> ${trail2.mean.toFixed(2)}`);
check('front buffer alternates (ping-pong is real)',
  (() => { const a = re._cur; re.tick(ps, 0.016, black); return re._cur !== a; })());
vals['rutt.decay'] = 0;

// ── 5b. Spatial phosphor decay ───────────────────────────────────────────────
log('\nphosphor spread');
// One lit frame, then one dark frame, so what we measure is purely the decay
// pass acting on the trail rather than a freshly drawn lattice.
// At 8 lines, not 60: a full lattice already covers the frame, leaving spreading
// nowhere to go — that version measured 12082 -> 12962, a 7% margin against a 5%
// threshold, which is the beam-width saturation mistake again. Sparse lines make
// the trail thin and the effect unmistakable.
const fade = (bleed) => {
  Object.assign(vals, { 'rutt.lines': 8, 'rutt.decay': 0.9, 'rutt.bleed': bleed });
  reset();
  vals['rutt.decay'] = 0.9;            // reset() zeroes decay; restore after
  re.tick(ps, 0.016, bright);
  re.tick(ps, 0.016, black);
  return stats();
};
const sharp = fade(0), spread = fade(2.5);
check('spread widens the trail', spread.lit > sharp.lit * 1.5,
  `bleed0=${sharp.lit} bleed2.5=${spread.lit} (${(spread.lit / sharp.lit).toFixed(2)}x)`);

// The pair that matters. Area up while mean does NOT rise means energy was
// redistributed, not manufactured. A kernel with gain > 1 would compound with
// the additive lattice draw every frame and run the buffer away to white, so
// this is the assertion standing between Spread and a saturating feedback loop.
check('spread redistributes energy rather than adding it',
  spread.mean <= sharp.mean * 1.02,
  `mean sharp=${sharp.mean.toFixed(2)} spread=${spread.mean.toFixed(2)}`);

// Runaway check, run long: many frames at maximum spread and near-maximum
// persistence must not drive the buffer to white.
Object.assign(vals, { 'rutt.decay': 0.98, 'rutt.bleed': 4 });
reset(); vals['rutt.decay'] = 0.98;
for (let i = 0; i < 60; i++) re.tick(ps, 0.016, bright);
const soak = stats();
check('60 frames at max persist + max spread does not saturate to white',
  soak.mean < 250, `mean=${soak.mean.toFixed(1)} max=${soak.max}`);

check('bleed 0 leaves the trail identical to no spread at all',
  (() => { const a = fade(0), b = fade(0); return a.lit === b.lit && a.mean === b.mean; })());
Object.assign(vals, { 'rutt.lines': 60, 'rutt.decay': 0, 'rutt.bleed': 0 });

// ── 6. Line count rebuild + gate ─────────────────────────────────────────────
log('\nrebuild and gate');
reset(); vals['rutt.lines'] = 16;  re.tick(ps, 0.016, bright);
const few = stats(); const fewVerts = re._mesh.geometry.attributes.position.count;
reset(); vals['rutt.lines'] = 200; re.tick(ps, 0.016, bright);
const many = stats(); const manyVerts = re._mesh.geometry.attributes.position.count;
check('geometry rebuilds on a line-count change', manyVerts > fewVerts,
  `${fewVerts} -> ${manyVerts} verts`);
check('more lines light more pixels', many.lit > few.lit, `${few.lit} -> ${many.lit}`);
check('rebuild is skipped when the count is unchanged',
  (() => { const g = re._mesh.geometry; re.tick(ps, 0.016, bright); return re._mesh.geometry === g; })());

vals['rutt.lines'] = 60;
reset();
vals['rutt.active'] = 0;
const beforeGate = re._cur;
re.tick(ps, 0.016, bright);
check('inactive tick draws nothing', re._cur === beforeGate && stats().lit === 0);
check('active flag follows the param', re.active === false);
vals['rutt.active'] = 1;

log(fails ? `\n${fails} FAILURE(S)` : '\nAll Rutt-Etra checks passed.');
document.title = fails ? `FAIL (${fails})` : 'PASS';

// Exposed for interactive probing from the devtools console — bare module
// specifiers ('three') do not resolve outside Vite's transform, so a debugging
// session cannot re-import the engine by hand.
Object.assign(window, { THREE, RuttEtra, renderer, re, ps, vals, stats, bright, black, reset });
</script>
