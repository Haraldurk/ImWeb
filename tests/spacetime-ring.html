<!DOCTYPE html>
<!-- Phase 25 acceptance test — docs/ImWeb-Spacetime-Blueprint.md §10.1.

     Deterministic ring-content assertion. Each captured frame is a solid colour
     encoding its own index, so a read at a known delay has exactly one correct
     answer. This replaces the PNG reference set the blueprint originally
     proposed: a temporal engine's output depends on the exact frame sequence
     that preceded it, and neither a playing movie nor a wall-clock noise source
     reproduces a sequence across runs, so image comparison would fail on
     correct code.

     Catches the two failures that actually occur: an off-by-one in the head/age
     arithmetic, and a tile index that disagrees between capture() and the read
     shader. Runs against BOTH strategies plus a grid re-computation.

     NOT covered here: tile-seam bleed (needs non-solid frame content — see
     blueprint §10.2) and the array path's GLSL3 dialect beyond compilation.

     Run:  npx vite --port 5199
           open http://localhost:5199/tests/spacetime-ring.html
     Re-run after every Phase 25 step (tap split, plane, each adapter). -->
<meta charset="utf-8">
<title>TD ring test</title>
<body style="background:#111;color:#ddd;font:12px monospace;white-space:pre"></body>
<script type="module">
import * as THREE from 'three';
import { TimeDisplaceEngine } from '/src/inputs/TimeDisplaceEngine.js';

const out = [];
const log = (s) => { out.push(s); document.body.textContent = out.join('\n'); };

const W = 32, H = 32, N = 8;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(W, H);

// Minimal ParameterSystem stub — tick() only ever calls ps.get(id).value
const vals = {
  'td.enabled': 1, 'td.mode': 0, 'td.direction': 0,
  'td.maxDelay': N - 1, 'td.delayCurve': 1.0,
  'td.scanPosition': 0.5, 'td.scanPosY': 0.5, 'td.scanWidth': 0.05,
  'td.invertMap': 0,
  // Phase 25 step 4 — neutral defaults must reproduce pre-step-4 output exactly.
  'td.angle': 0, 'td.mapAmount': 0, 'td.mapSource': 5,
};
const ps = { get: (id) => (id in vals ? { value: vals[id] } : undefined) };

/** A solid 1x1 texture whose red channel encodes the frame index. */
const frameTex = (k) => {
  const t = new THREE.DataTexture(
    new Uint8Array([20 * k + 10, 0, 0, 255]), 1, 1, THREE.RGBAFormat,
  );
  t.needsUpdate = true;
  return t;
};

/** Force the compatibility path without touching production code. */
const forceAtlasOn = (ring) => {
  if (ring._arrayRT) { ring._arrayRT.dispose(); ring._arrayRT = null; }
  ring._useArray = false;
  ring._allocateAtlas();
  ring._rev++;                 // taps re-apply layout uniforms on a rev change
  ring._head = 0; ring._count = 0;
};

function runOne(label, forceAtlas, reallocTo = null) {
  const eng  = new TimeDisplaceEngine(renderer, W, H, N);
  const ring = eng.ring;

  if (forceAtlas) forceAtlasOn(ring);

  if (reallocTo) {
    // Buffer-resolution change on the atlas path: the grid is recomputed and the
    // tap's uCols/uTileScale/uInset must follow, or capture() and the read
    // disagree about tile layout. ring.setBufferResolution() re-probes and would
    // flip back to array on healthy hardware, so drive the atlas half directly.
    ring._bufW = reallocTo[0]; ring._bufH = reallocTo[1];
    ring._disposeAtlas();
    forceAtlasOn(ring);
    eng.tap.setSize(reallocTo[0], reallocTo[1]);
  }

  log(`\n── ${label} — strategy=${eng.strategy}, slots=${eng.slots}` +
      (eng.strategy === 'atlas'
        ? `, grid=${ring.cols}x${ring.rows}, tile=${ring.bufW}x${ring.bufH}`
        : ''));

  // Write M > N frames so the head has wrapped — wrapping is where off-by-one
  // and negative-modulus bugs live.
  const M = N + 3;
  for (let k = 0; k < M; k++) eng.capture(frameTex(k));
  log(`   wrote ${M} frames (head=${ring.head}, count=${ring.count})`);

  vals['td.maxDelay'] = eng.slots - 1;
  eng.tick(ps, 1 / 60, null);

  // Read a row of pixels and compare each against the frame that d(x) selects.
  const rw = eng.tap.width, rh = eng.tap.height;
  const buf = new Uint8Array(rw * rh * 4);
  renderer.readRenderTargetPixels(eng.tap._outRT, 0, 0, rw, rh, buf);

  const maxDelay = eng.slots - 1;
  const maxBack  = Math.max(1, Math.min(eng.slots - 1, ring.count - 1));
  let fails = 0, checked = 0;

  for (let i = 0; i < rw; i++) {
    const uvx = (i + 0.5) / rw;              // texel centre
    let d = uvx * maxDelay;                  // mode 0 (slitScanX), curve 1
    d = Math.min(Math.max(d, 0), maxBack);
    const age  = Math.floor(d);
    const slot = ((ring.head - 1 - age) % eng.slots + eng.slots) % eng.slots;
    // Slot `slot` last received frame index k where k % slots === slot and k < M
    let k = -1;
    for (let c = M - 1; c >= 0; c--) if (c % eng.slots === slot) { k = c; break; }
    const expect = 20 * k + 10;

    // Sample mid-height; row-major from bottom-left.
    const px = buf[((rh >> 1) * rw + i) * 4];
    checked++;
    if (Math.abs(px - expect) > 2) {
      fails++;
      if (fails <= 6) log(`   FAIL x=${i} uv=${uvx.toFixed(3)} age=${age} slot=${slot} expect=${expect} got=${px}`);
    }
  }
  log(fails === 0 ? `   PASS — ${checked}/${checked} pixels read the frame they asked for`
                  : `   ${fails}/${checked} pixels wrong`);
  eng.dispose();
  return fails === 0;
}

/**
 * Step 4: the plane's angle must be an EXACT identity at 0 (so every saved state
 * renders as before), and must actually rotate the field at 90°.
 *
 * Read the whole output at angle 0, then at 90°, and compare. Mode 0 is a ramp
 * along x, so a 90° rotation turns it into a ramp along y: the angle-0 frame must
 * vary across columns and not rows, and the angle-90 frame the opposite.
 */
function runAngle() {
  const eng  = new TimeDisplaceEngine(renderer, W, H, N);
  const ring = eng.ring;
  const M = N + 3;
  for (let k = 0; k < M; k++) eng.capture(frameTex(k));
  vals['td.maxDelay'] = eng.slots - 1;

  const grab = (deg) => {
    vals['td.angle'] = deg;
    eng.tick(ps, 1 / 60, null);
    const buf = new Uint8Array(W * H * 4);
    renderer.readRenderTargetPixels(eng.tap._outRT, 0, 0, W, H, buf);
    return buf;
  };

  const at0  = grab(0);
  const at90 = grab(90);
  vals['td.angle'] = 0;

  // Variation along a row (across columns) vs down a column (across rows).
  const spread = (buf, along) => {
    const vs = [];
    for (let i = 0; i < (along === 'x' ? W : H); i++) {
      const idx = along === 'x' ? ((H >> 1) * W + i) : (i * W + (W >> 1));
      vs.push(buf[idx * 4]);
    }
    return Math.max(...vs) - Math.min(...vs);
  };

  const h0 = spread(at0, 'x'),  v0 = spread(at0, 'y');
  const h9 = spread(at90, 'x'), v9 = spread(at90, 'y');

  log(`\n── ANGLE (mode 0 = ramp along x)`);
  log(`   angle 0 : spread across columns=${h0}, down rows=${v0}`);
  log(`   angle 90: spread across columns=${h9}, down rows=${v9}`);

  // Re-read at 0 and require byte-identity with the first angle-0 read: proves
  // the rotation is a true identity and leaves no residue in the uniforms.
  const again = grab(0);
  let identical = true;
  for (let i = 0; i < at0.length; i++) if (at0[i] !== again[i]) { identical = false; break; }

  const rotates  = h0 > 20 && v0 === 0 && v9 > 20 && h9 === 0;
  log(rotates   ? '   PASS — angle 0 varies along x only; angle 90 along y only'
                : '   FAIL — rotation did not transpose the ramp');
  log(identical ? '   PASS — returning to angle 0 is byte-identical (exact identity)'
                : '   FAIL — angle 0 output changed after visiting 90°');
  eng.dispose();
  return rotates && identical;
}

const a = runOne('ARRAY path (primary)', false);
const b = runOne('ATLAS path (forced fallback)', true);
// Non-square tile, and a grid re-computation after the tile size changed.
const c = runOne('ATLAS after buffer-res change (48x20)', true, [48, 20]);
const d = runAngle();
const all = a && b && c && d;
log(`\n=== RESULT: ${all ? 'ALL PASS' : 'FAILURE'} ===`);
log(`array=${a ? 'pass' : 'FAIL'} atlas=${b ? 'pass' : 'FAIL'} atlas-realloc=${c ? 'pass' : 'FAIL'} angle=${d ? 'pass' : 'FAIL'}`);
window.__tdResult = { array: a, atlas: b, atlasRealloc: c, angle: d };
</script>
