<!DOCTYPE html>
<!-- VasulkaWarp tape-coverage test.

     The bug: the strip target was allocated at CANVAS width while the write head
     wrapped at bufSize, and the output shader read the target's full width. Any
     bufSize below the canvas width therefore left every column past it unwritten
     — the sweep ran from the left edge to column bufSize and restarted, black
     beyond. Only "1920 cols" on a 1920-wide canvas lined up.

     So the assertion is coverage: after bufSize writes, EVERY column of the tape
     must hold live content, at every bufSize — not just the one that matches the
     canvas width.

     Driven directly, no requestAnimationFrame: a backgrounded tab suspends rAF
     (document.hidden ⇒ 0 fps) and would make this pass vacuously.

     Run:  npx vite --port 5199
           open http://localhost:5199/tests/vasulka-tape.html
-->
<meta charset="utf-8">
<title>VasulkaWarp tape test</title>
<body style="background:#111;color:#ddd;font:12px monospace;white-space:pre"></body>
<script type="module">
import * as THREE from 'three';
import { VasulkaWarp } from '/src/inputs/VasulkaWarp.js';

const out = [];
const log = (s) => { out.push(s); document.body.textContent = out.join('\n'); };

// A deliberately WIDE canvas so bufSize 480/960 are both below it — the exact
// configuration that used to fail.
const CANVAS_W = 1920, CANVAS_H = 64;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(256, 64);

/** Solid mid-grey source, so "written" is unambiguous against the black tape. */
const solid = (v) => {
  const t = new THREE.DataTexture(
    new Uint8Array([v, v, v, 255]), 1, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.needsUpdate = true;
  return t;
};

const pvals = {
  'vwarp.axis': 0, 'vwarp.flip': 0, 'vwarp.mix': 1,
  'vwarp.pos': 0, 'vwarp.span': 1, 'vwarp.anchor': 0,
};
const ps = { get: (id) => (id in pvals ? { value: pvals[id] } : undefined) };

function run(bufSize) {
  const vw = new VasulkaWarp(renderer, CANVAS_W, CANVAS_H, bufSize);
  const src = solid(200);

  log(`\n── bufSize ${bufSize} on a ${CANVAS_W}-wide canvas`);
  log(`   tape target: ${vw._stripRT.width}×${vw._stripRT.height}` +
      (vw._stripRT.width === bufSize ? '  (= bufSize)' : `  EXPECTED width ${bufSize}`));

  // Exactly bufSize single-column writes should fill the tape once.
  for (let i = 0; i < bufSize; i++) vw.capture(src, 1);

  // Read the tape itself and count columns that received content.
  const buf = new Uint8Array(vw._stripRT.width * 1 * 4);
  renderer.readRenderTargetPixels(vw._stripRT, 0, vw._stripRT.height >> 1, vw._stripRT.width, 1, buf);
  let written = 0, firstBlank = -1;
  for (let x = 0; x < vw._stripRT.width; x++) {
    if (buf[x * 4] > 100) written++;
    else if (firstBlank < 0) firstBlank = x;
  }
  const total = vw._stripRT.width;
  const full = written === total;
  log(`   columns written: ${written}/${total}` +
      (full ? '' : `  — first blank column at x=${firstBlank}`));
  log(`   head wrapped back to 0: ${vw._writeIdx === 0 ? 'yes' : 'no (' + vw._writeIdx + ')'}`);
  log(full ? '   PASS — whole tape covered' : '   FAIL — tape only partly written');

  vw.dispose();
  return full && vw._stripRT.width === bufSize;
}

const results = [480, 960, 1920].map(run);

// Resize must not retune the time depth (it used to overwrite _bufSize with w).
log(`\n── resize keeps the tape length`);
const vw = new VasulkaWarp(renderer, CANVAS_W, CANVAS_H, 480);
const before = vw._bufSize;
vw.resize(1280, 96);
const after = vw._bufSize;
const kept = before === after && vw._stripRT.width === 480 && vw._stripRT.height === 96;
log(`   bufSize ${before} → ${after}; tape now ${vw._stripRT.width}×${vw._stripRT.height}`);
log(kept ? '   PASS — width is time depth, only height follows the canvas'
         : '   FAIL — resize altered the tape length');
vw.dispose();

/**
 * A null source must HOLD the tape, not erase it.
 *
 * Reachable as soon as vwarp.source names something inactive — Camera with the
 * camera off is the default case. Without the guard the blit runs with a null
 * sampler and writes BLACK columns, actively destroying history one column per
 * frame, which would look like the effect "fading out" for no visible reason.
 */
log(`\n── null source holds the tape`);
const vw2 = new VasulkaWarp(renderer, 256, 16, 64);
const src2 = solid(220);
for (let i = 0; i < 64; i++) vw2.capture(src2, 1);       // fill it
const headBefore = vw2._writeIdx;
for (let i = 0; i < 20; i++) vw2.capture(null, 1);       // the guarded path
const nb = new Uint8Array(64 * 4);
renderer.readRenderTargetPixels(vw2._stripRT, 0, 8, 64, 1, nb);
let bright = 0;
for (let x = 0; x < 64; x++) if (nb[x * 4] > 150) bright++;
const held = bright === 64 && vw2._writeIdx === headBefore;
log(`   head ${headBefore} → ${vw2._writeIdx}; bright columns ${bright}/64`);
log(held ? '   PASS — tape intact, head did not advance'
         : '   FAIL — null source wrote into the tape or moved the head');
vw2.dispose();

/**
 * uAnchor picks WHICH of two things stays still — and both are legitimate.
 *
 * A tape column holds SOURCE column c captured when the head was at c, so the
 * read chooses both which column you see and how old it is. You cannot fix both:
 *
 *   anchor 0 — output column x always shows source column x. Picture spatially
 *              TRUE; the tear sweeps. Historical behaviour, and the default.
 *   anchor 1 — age is a function of position alone. Temporal gradient stationary;
 *              the PICTURE slides sideways with the head.
 *
 * Tested with a spatially structured source (a horizontal ramp), because a solid
 * frame cannot tell the two apart — which is exactly how shipping anchor=1 by
 * default slipped through in 3db09f2.
 */
const OW = 128, OB = 32;

/** A source whose value ramps across x, so a horizontal shift is measurable. */
function rampTex() {
  const data = new Uint8Array(OB * 4);
  for (let c = 0; c < OB; c++) {
    const v = Math.round((c / (OB - 1)) * 255);
    data[c * 4] = data[c * 4 + 1] = data[c * 4 + 2] = v; data[c * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, OB, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}

/** Output row after filling the tape from a ramp and advancing the head to k. */
function rampRow(anchor, k) {
  const v = new VasulkaWarp(renderer, OW, 8, OB);
  const ramp = rampTex();
  for (let i = 0; i < OB + k; i++) v.capture(ramp, 1);   // fill, head ends at k
  pvals['vwarp.anchor'] = anchor;
  v.applyParams(ps);
  v.render(ramp);
  const row = new Uint8Array(OW * 4);
  renderer.readRenderTargetPixels(v.outputRT, 0, 4, OW, 1, row);
  v.dispose();
  // Sample one value per tape column, at the column's centre.
  const step = OW / OB;
  return Array.from({ length: OB }, (_, c) => row[Math.floor((c + 0.5) * step) * 4]);
}

log(`\n── uAnchor: picture-true (0) vs age-true (1)`);
const drift = (a) => {
  const at0 = rampRow(a, 0), at8 = rampRow(a, 8);
  let maxDiff = 0;
  for (let i = 0; i < at0.length; i++) maxDiff = Math.max(maxDiff, Math.abs(at0[i] - at8[i]));
  return maxDiff;
};
const d0 = drift(0), d1 = drift(1);
pvals['vwarp.anchor'] = 0;
log(`   anchor 0 → picture change when the head moves 8 columns: ${d0}  (want ~0)`);
log(`   anchor 1 → picture change when the head moves 8 columns: ${d1}  (want large)`);
const anchored = d0 <= 8 && d1 > 40;
log(anchored ? '   PASS — anchor 0 holds the picture still; anchor 1 slides it, as designed'
             : '   FAIL — the two modes are not behaving as documented');

/**
 * span magnifies, pos scrubs.
 *
 * One bright column again. With span = 1 it occupies one tape column's worth of
 * the frame; at span = 0.25 the same column must cover 4x as many pixels, because
 * a quarter of the tape is now spread across the whole frame. And pos must move
 * where it lands, which is what makes it playable.
 */
function brightRun(span, pos) {
  const v = new VasulkaWarp(renderer, OW, 8, OB);
  const dark = solid(30), bright = solid(240);
  for (let i = 0; i < OB; i++) v.capture(dark, 1);
  v.capture(bright, 1);
  pvals['vwarp.span'] = span;
  pvals['vwarp.pos'] = pos;
  pvals['vwarp.anchor'] = 1;   // span/pos are measured against the stationary read
  v.applyParams(ps);
  v.render(dark);
  const row = new Uint8Array(OW * 4);
  renderer.readRenderTargetPixels(v.outputRT, 0, 4, OW, 1, row);
  let count = 0, argmax = 0, peak = -1;
  for (let x = 0; x < OW; x++) {
    if (row[x * 4] > 120) count++;
    if (row[x * 4] > peak) { peak = row[x * 4]; argmax = x; }
  }
  v.dispose();
  return { count, argmax };
}

log(`\n── span magnifies the window, pos scrubs it`);
const sFull = brightRun(1.0, 0);
const sQtr  = brightRun(0.25, 0);
const pHalf = brightRun(1.0, 0.5);
pvals['vwarp.span'] = 1; pvals['vwarp.pos'] = 0; pvals['vwarp.anchor'] = 0;  // restore
log(`   span 1.00  → bright width ${sFull.count}px at x=${sFull.argmax}`);
log(`   span 0.25  → bright width ${sQtr.count}px at x=${sQtr.argmax}   (expect ~4x wider)`);
log(`   pos  0.50  → bright at x=${pHalf.argmax}   (expect ~half a frame from ${sFull.argmax})`);
const magnifies = sQtr.count >= sFull.count * 2.5;
const scrubs = Math.abs(pHalf.argmax - sFull.argmax) > OW * 0.25;
log(magnifies ? '   PASS — narrowing the span magnifies the slice'
              : '   FAIL — span did not magnify');
log(scrubs ? '   PASS — pos moves the window'
           : '   FAIL — pos had no effect');

/**
 * What does Axis actually redirect?
 *
 * capture() ALWAYS scissors columns, so time always runs along the tape's x.
 * Axis only changes which output coordinate feeds readOffset and which tape axis
 * it indexes. Two probes separate the effects: a source varying only in x, and
 * one varying only in y. Whichever probe changes tells us which axis the read is
 * actually moving.
 */
function probe(axis, span, vertical) {
  const N = OB;
  const data = new Uint8Array(N * N * 4);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const v = Math.round(((vertical ? y : x) / (N - 1)) * 255);
    const i = (y * N + x) * 4;
    data[i] = data[i + 1] = data[i + 2] = v; data[i + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;

  const v = new VasulkaWarp(renderer, OW, OW, OB);
  for (let i = 0; i < OB; i++) v.capture(t, 1);
  pvals['vwarp.axis'] = axis; pvals['vwarp.span'] = span;
  pvals['vwarp.pos'] = 0; pvals['vwarp.anchor'] = 0;
  v.applyParams(ps);
  v.render(t);
  const buf = new Uint8Array(OW * OW * 4);
  renderer.readRenderTargetPixels(v.outputRT, 0, 0, OW, OW, buf);
  v.dispose();
  const mid = OW >> 1;
  return {
    acrossX: Array.from({ length: 8 }, (_, i) => buf[(mid * OW + i * 16) * 4]),
    downY:   Array.from({ length: 8 }, (_, i) => buf[(i * 16 * OW + mid) * 4]),
  };
}

log(`\n── what Axis redirects (capture always writes COLUMNS, so time runs along x)`);
for (const axis of [0, 1]) {
  const h = probe(axis, 0.25, false);   // source varies in x only
  const vp = probe(axis, 0.25, true);   // source varies in y only
  const hFlat = new Set(h.acrossX).size === 1;
  const vFlat = new Set(vp.downY).size === 1;
  log(`   axis ${axis}: x-probe across x = [${h.acrossX.join(',')}]`);
  log(`             y-probe down  y = [${vp.downY.join(',')}]`);
  log(`             span 0.25 compressed the ${axis === 0 ? 'X' : 'Y'} axis: ` +
      `x-probe ${hFlat ? 'flat' : 'varying'}, y-probe ${vFlat ? 'flat' : 'varying'}`);
}
pvals['vwarp.axis'] = 0; pvals['vwarp.span'] = 1;

const all = results.every(Boolean) && kept && held && anchored && magnifies && scrubs;
log(`\n=== RESULT: ${all ? 'ALL PASS' : 'FAILURE'} ===`);
window.__vwResult = {
  coverage: results, resizeKeepsDepth: kept, nullHolds: held,
  anchored, anchorDrift: { off: d0, on: d1 }, magnifies, scrubs, all,
};
</script>
