<!DOCTYPE html>
<!-- VasulkaWarp tape-coverage test.

     The bug: the strip target was allocated at CANVAS width while the write head
     wrapped at bufSize, and the output shader read the target's full width. Any
     bufSize below the canvas width therefore left every column past it unwritten
     — the sweep ran from the left edge to column bufSize and restarted, black
     beyond. Only "1920 cols" on a 1920-wide canvas lined up.

     So the assertion is coverage: after bufSize writes, EVERY column of the tape
     must hold live content, at every bufSize — not just the one that matches the
     canvas width.

     Driven directly, no requestAnimationFrame: a backgrounded tab suspends rAF
     (document.hidden ⇒ 0 fps) and would make this pass vacuously.

     Run:  npx vite --port 5199
           open http://localhost:5199/tests/vasulka-tape.html
-->
<meta charset="utf-8">
<title>VasulkaWarp tape test</title>
<body style="background:#111;color:#ddd;font:12px monospace;white-space:pre"></body>
<script type="module">
import * as THREE from 'three';
import { VasulkaWarp } from '/src/inputs/VasulkaWarp.js';

const out = [];
const log = (s) => { out.push(s); document.body.textContent = out.join('\n'); };

// A deliberately WIDE canvas so bufSize 480/960 are both below it — the exact
// configuration that used to fail.
const CANVAS_W = 1920, CANVAS_H = 64;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(256, 64);

/** Solid mid-grey source, so "written" is unambiguous against the black tape. */
const solid = (v) => {
  const t = new THREE.DataTexture(
    new Uint8Array([v, v, v, 255]), 1, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.needsUpdate = true;
  return t;
};

const ps = { get: (id) => ({ value: { 'vwarp.axis': 0, 'vwarp.flip': 0, 'vwarp.mix': 1 }[id] }) };

function run(bufSize) {
  const vw = new VasulkaWarp(renderer, CANVAS_W, CANVAS_H, bufSize);
  const src = solid(200);

  log(`\n── bufSize ${bufSize} on a ${CANVAS_W}-wide canvas`);
  log(`   tape target: ${vw._stripRT.width}×${vw._stripRT.height}` +
      (vw._stripRT.width === bufSize ? '  (= bufSize)' : `  EXPECTED width ${bufSize}`));

  // Exactly bufSize single-column writes should fill the tape once.
  for (let i = 0; i < bufSize; i++) vw.capture(src, 1);

  // Read the tape itself and count columns that received content.
  const buf = new Uint8Array(vw._stripRT.width * 1 * 4);
  renderer.readRenderTargetPixels(vw._stripRT, 0, vw._stripRT.height >> 1, vw._stripRT.width, 1, buf);
  let written = 0, firstBlank = -1;
  for (let x = 0; x < vw._stripRT.width; x++) {
    if (buf[x * 4] > 100) written++;
    else if (firstBlank < 0) firstBlank = x;
  }
  const total = vw._stripRT.width;
  const full = written === total;
  log(`   columns written: ${written}/${total}` +
      (full ? '' : `  — first blank column at x=${firstBlank}`));
  log(`   head wrapped back to 0: ${vw._writeIdx === 0 ? 'yes' : 'no (' + vw._writeIdx + ')'}`);
  log(full ? '   PASS — whole tape covered' : '   FAIL — tape only partly written');

  vw.dispose();
  return full && vw._stripRT.width === bufSize;
}

const results = [480, 960, 1920].map(run);

// Resize must not retune the time depth (it used to overwrite _bufSize with w).
log(`\n── resize keeps the tape length`);
const vw = new VasulkaWarp(renderer, CANVAS_W, CANVAS_H, 480);
const before = vw._bufSize;
vw.resize(1280, 96);
const after = vw._bufSize;
const kept = before === after && vw._stripRT.width === 480 && vw._stripRT.height === 96;
log(`   bufSize ${before} → ${after}; tape now ${vw._stripRT.width}×${vw._stripRT.height}`);
log(kept ? '   PASS — width is time depth, only height follows the canvas'
         : '   FAIL — resize altered the tape length');
vw.dispose();

/**
 * A null source must HOLD the tape, not erase it.
 *
 * Reachable as soon as vwarp.source names something inactive — Camera with the
 * camera off is the default case. Without the guard the blit runs with a null
 * sampler and writes BLACK columns, actively destroying history one column per
 * frame, which would look like the effect "fading out" for no visible reason.
 */
log(`\n── null source holds the tape`);
const vw2 = new VasulkaWarp(renderer, 256, 16, 64);
const src2 = solid(220);
for (let i = 0; i < 64; i++) vw2.capture(src2, 1);       // fill it
const headBefore = vw2._writeIdx;
for (let i = 0; i < 20; i++) vw2.capture(null, 1);       // the guarded path
const nb = new Uint8Array(64 * 4);
renderer.readRenderTargetPixels(vw2._stripRT, 0, 8, 64, 1, nb);
let bright = 0;
for (let x = 0; x < 64; x++) if (nb[x * 4] > 150) bright++;
const held = bright === 64 && vw2._writeIdx === headBefore;
log(`   head ${headBefore} → ${vw2._writeIdx}; bright columns ${bright}/64`);
log(held ? '   PASS — tape intact, head did not advance'
         : '   FAIL — null source wrote into the tape or moved the head');
vw2.dispose();

/**
 * The read must be ANCHORED to the write head.
 *
 * The read used to be `readOffset = coord`, which never learned where the head
 * was — so the age of a given output column changed as the head moved, and the
 * jump between "one frame old" and "a whole tape old" travelled across the
 * picture. That was the sliding tear the owner reported.
 *
 * Decisive assertion: fill the tape dark, write ONE bright column, and find where
 * it lands in the OUTPUT. Anchored, the newest column is always just inside the
 * trailing edge whatever the head position. Unanchored, it appears AT the head
 * and therefore moves — so this test distinguishes the two directly.
 */
log(`\n── read is anchored to the write head`);
const OW = 128, OB = 32;
const positions = [];
for (const k of [0, 5, 13, 27]) {
  const v = new VasulkaWarp(renderer, OW, 8, OB);
  const dark = solid(30), bright = solid(240);
  for (let i = 0; i < k; i++) v.capture(dark, 1);        // move the head to k
  for (let i = 0; i < OB; i++) v.capture(dark, 1);       // fill dark, head back to k
  v.capture(bright, 1);                                  // newest column = k
  v.render(dark);

  const row = new Uint8Array(OW * 4);
  renderer.readRenderTargetPixels(v.outputRT, 0, 4, OW, 1, row);
  let argmax = 0, peak = -1;
  for (let x = 0; x < OW; x++) if (row[x * 4] > peak) { peak = row[x * 4]; argmax = x; }
  positions.push({ head: k, argmax, peak });
  v.dispose();
}
// Each tape column is OW/OB px wide; "trailing edge" = within the last two.
const edge = OW - (OW / OB) * 2;
const anchored = positions.every((p) => p.argmax >= edge && p.peak > 150);
for (const p of positions) {
  log(`   head ${String(p.head).padStart(2)} → brightest output column ${p.argmax} (peak ${p.peak})`);
}
log(`   expected ≥ ${edge} for every head position`);
log(anchored ? '   PASS — newest column pinned to the trailing edge, head-independent'
             : '   FAIL — newest column moves with the head (read not anchored)');

const all = results.every(Boolean) && kept && held && anchored;
log(`\n=== RESULT: ${all ? 'ALL PASS' : 'FAILURE'} ===`);
window.__vwResult = {
  coverage: results, resizeKeepsDepth: kept, nullHolds: held,
  anchored, headPositions: positions, all,
};
</script>
